<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Controle de manutenção</title>
  <script>
    try {
      var theme = localStorage.getItem("gp-theme");
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    window.GP_ASSET_VERSION = new URLSearchParams(location.search).get("v") || String(Date.now());
    var gpCss = document.createElement("link");
    gpCss.rel = "stylesheet";
    gpCss.href = "css/styles.css?v=" + window.GP_ASSET_VERSION;
    document.head.appendChild(gpCss);
  </script>
</head>
<body>
  <div class="viewport">
    <div class="shell" id="shell">
      <aside class="side" id="side">
        <div class="brand">
          <img src="assets/logo-noxxon.png" alt="Noxxon Sat" />
        </div>
        <nav class="menu" aria-label="Menu">
          <button class="nav nav-dashboard active" id="nav-dashboard" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Dashboard
          </button>
          <button class="nav nav-relatorio" id="nav-relatorio" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            Relatório
          </button>
        </nav>
        <div class="promo">
          <button class="btn-primary" id="btn-atualizar" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Atualizar dados
          </button>
          <small class="last-load" id="last-load">Aguardando a planilha</small>
        </div>
      </aside>

      <main class="main">
        <header class="report-bar" id="report-bar" hidden>
          <div class="bar-side">
            <button class="icon-btn theme-toggle" type="button" aria-label="Alternar tema claro e escuro">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </button>
            <img class="bar-logo gato" src="assets/logo-gatopreto.png" alt="Viação Gato Preto" />
          </div>
        </header>
        <header class="top" id="top">
          <div>
            <h1>Controle de manutenção</h1>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
            <input id="search" type="search" placeholder="Equipamento, ID, mês ou diagnóstico" autocomplete="off" />
          </label>
        </header>

        <section id="view-dashboard">
          <div class="kpis">
            <button class="kpi" type="button" data-familia="UCP NX6000">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
              <span class="kpi-name">UCP</span>
              <strong class="kpi-val" id="kpi-ucp">—</strong>
            </button>
            <button class="kpi" type="button" data-familia="TDM NX6010">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25a3.2 3.2 0 0 0-2.25-.93h-.86L13.5 6.5A5.5 5.5 0 0 0 9 4.8L8 6l3.2 1.2.4 2.2 4.2 4.2 2.2.4L19.2 17l1.2-1a5.5 5.5 0 0 0-1.7-4.5z"/></svg></span>
              <span class="kpi-name">TDM</span>
              <strong class="kpi-val" id="kpi-tdm">—</strong>
            </button>
            <button class="kpi" type="button" data-familia="SWITCH NX6020">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1-.33H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 .33 1 1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .6 1 1.65 1.65 0 0 0 1 .33H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1 .33 1.65 1.65 0 0 0-.51 1z"/></svg></span>
              <span class="kpi-name">SWITCH</span>
              <strong class="kpi-val" id="kpi-switch">—</strong>
            </button>
            <button class="kpi" type="button" data-familia="NOBREAK">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2M10 11v2"/></svg></span>
              <span class="kpi-name">NOBREAK</span>
              <strong class="kpi-val" id="kpi-nobreak">—</strong>
            </button>
          </div>

          <article class="card chart-card">
            <div class="card-head">
              <div class="chart-title">
                <button class="chart-back" id="chart-back" type="button" hidden aria-label="Voltar para os meses">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <h2 id="chart-title">Manutenção</h2>
              </div>
              <select id="year-select" aria-label="Ano do gráfico"></select>
            </div>
            <div class="chart-box"><canvas id="line-chart"></canvas></div>
          </article>

          <div class="split">
            <article class="card reinc-card">
              <div class="card-head">
                <h2>Reincidência</h2>
              </div>
              <div class="reinc-scroll" id="reinc-list"></div>
            </article>
            <article class="card pie-card">
              <div class="pie-wrap"><canvas id="pie-chart"></canvas></div>
              <div class="legend" id="pie-legend"></div>
            </article>
          </div>
        </section>

        <section id="view-report" hidden>
          <article class="card report-card">
            <div class="card-head">
              <h2>Relatório</h2>
              <button class="btn-primary" id="btn-export" type="button">Exportar Excel</button>
            </div>
            <div class="table-wrap">
              <table class="report-table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>ID</th>
                    <th>Equipamento</th>
                    <th>Diagnóstico</th>
                  </tr>
                </thead>
                <tbody id="report-body"></tbody>
              </table>
            </div>
            <div class="pager">
              <button type="button" id="page-prev">Anterior</button>
              <span id="page-info"></span>
              <button type="button" id="page-next">Próxima</button>
            </div>
          </article>
        </section>
      </main>

      <aside class="rail" id="rail">
        <div class="profile-row">
          <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <div class="who">
            <div>
              <strong>Gato Preto</strong>
              <span>Viação</span>
            </div>
            <div class="avatar">
              <img src="assets/logo-gatopreto.png" alt="Viação Gato Preto" />
            </div>
          </div>
        </div>

        <div class="wallet">
          <svg class="waves" viewBox="0 0 180 150" preserveAspectRatio="none" aria-hidden="true">
            <path d="M40 0c18 18 18 36 0 54s-18 36 0 54 18 36 0 54"/>
            <path d="M70 0c18 18 18 36 0 54s-18 36 0 54 18 36 0 54"/>
            <path d="M100 0c18 18 18 36 0 54s-18 36 0 54 18 36 0 54"/>
            <path d="M130 0c18 18 18 36 0 54s-18 36 0 54 18 36 0 54"/>
          </svg>
          <p>Total de equipamentos</p>
          <strong id="wallet-total">—</strong>
        </div>

        <section class="diag-panel">
          <div class="card-head">
            <h2>Diagnóstico</h2>
          </div>
          <div class="diag-scroll">
            <table class="plain">
              <thead>
                <tr><th>Diagnóstico</th><th>Quantidade</th></tr>
              </thead>
              <tbody id="diag-body"></tbody>
            </table>
          </div>
        </section>
      </aside>

      <div class="loading" id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Lendo a planilha…</p>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="chart-tip" id="chart-tip" hidden></div>
  <script>
    (function () {
      var version = window.GP_ASSET_VERSION || String(Date.now());
      function load(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src + "?v=" + version;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }
      load("js/chart.umd.min.js").then(function () { return load("js/app.js"); });
    })();
  </script>
</body>
</html>
